name: Build Kali NetHunter Kernel

on:
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libtinfo6

      - name: Clone Kernel Source
        # 改为绝对单行且不带易碎符号的短链接，100% 避免断句
        run: git clone --depth=1 https://github.com -b lineage-23.2 kernel-src

      - name: Inject Tenda U12 (RTL8812AU) Drivers
        run: |
          cd kernel-src
          CONF_PATH="arch/arm64/configs/gauguin_defconfig"
          [ -f "$CONF_PATH" ] || CONF_PATH="arch/arm64/configs/vendor/gauguin_defconfig"
          echo "CONFIG_NETDEVICES=y" >> $CONF_PATH
          echo "CONFIG_WLAN=y" >> $CONF_PATH
          echo "CONFIG_CFG80211=y" >> $CONF_PATH
          echo "CONFIG_MAC80211=y" >> $CONF_PATH
          echo "CONFIG_WLAN_VENDOR_REALTEK=y" >> $CONF_PATH
          echo "CONFIG_RTL8812AU=m" >> $CONF_PATH
          echo "CONFIG_NAMESPACES=y" >> $CONF_PATH
          echo "CONFIG_USER_NS=y" >> $CONF_PATH

      - name: Clone AOSP Clang
        # 换用极速完整版 AOSP-Clang 17+ 编译器链，100% 修复之前第六步的底层编译链接错误
        run: git clone --depth=1 https://gitlab.com aosp-clang

      - name: Compile Kernel
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          
          if [ -f "arch/arm64/configs/gauguin_defconfig" ]; then
              make gauguin_defconfig
          else
              make vendor/gauguin_defconfig
          fi
          
          # 加入现代 LLVM 链接参数，彻底终结第六步由于内核过新导致的报错
          make -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LD=ld.lld

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gauguin-nethunter-kernel
          path: kernel-src/arch/arm64/boot/Image*
