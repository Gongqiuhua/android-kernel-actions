
name: Build NetHunter Kernel for Gauguin

on:
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Clone Kernel Source
        # 单行直链，拒绝任何分支截断隐患
        run: git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_gauguin -b lineage-23.2 kernel-src

      - name: Inject Tenda U12 (RTL8812AU) Drivers
        run: |
          cd kernel-src
          echo "CONFIG_NETDEVICES=y" >> arch/arm64/configs/gauguin_defconfig
          echo "CONFIG_WLAN=y" >> arch/arm64/configs/gauguin_defconfig
          echo "CONFIG_CFG80211=y" >> arch/arm64/configs/gauguin_defconfig
          echo "CONFIG_MAC80211=y" >> arch/arm64/configs/gauguin_defconfig
          echo "CONFIG_WLAN_VENDOR_REALTEK=y" >> arch/arm64/configs/gauguin_defconfig
          echo "CONFIG_RTL8812AU=m" >> arch/arm64/configs/gauguin_defconfig
          echo "CONFIG_NAMESPACES=y" >> arch/arm64/configs/gauguin_defconfig
          echo "CONFIG_USER_NS=y" >> arch/arm64/configs/gauguin_defconfig

      - name: Clone Proton Clang
        run: git clone --depth=1 https://github.com aosp-clang

      - name: Compile Kernel
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          make gauguin_defconfig
          make -j$(nproc) CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gauguin-nethunter-kernel
          path: kernel-src/arch/arm64/boot/Image.gz*
